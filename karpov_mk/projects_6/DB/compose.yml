version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_container
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: testdb
    volumes:
      - postgres_data:/var/lib/postgresql
    command: >
      postgres 
      -c 'listen_addresses=*' 
      -c 'port=5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: